const cols = {
  prof: [['等级','r.lv'],['选手/范围','r.who'],['题目','r.sub'],['定位','r.loc'],['命中词','r.word'],['原文','r.text'],['备注','r.note']],
  mat:  [['分类','r.cat'],['选手','r.who'],['定位','r.loc'],['原文','r.text'],['看点','r.note']],
  mat2: [['分类','r.cat'],['选手','r.who'],['定位','r.loc'],['原文','r.text'],['看点','r.note']],
  nm:   [['分类','r.kind'],['选手','r.who'],['定位','r.loc'],['原文','r.text']]
};
let tab='prof', sortKey=-1, sortAsc=true;
const stats=document.getElementById('stats');
Object.entries(D.stats).forEach(([k,v])=>{const d=document.createElement('div');d.className='stat';d.innerHTML='<b>'+v.toLocaleString()+'</b><span>'+k+'</span>';stats.appendChild(d)});
const f=document.getElementById('filter'), q=document.getElementById('q'), tb=document.getElementById('tb'), cnt=document.getElementById('count');
function options(){const set=new Set(D[tab].map(r=>tab==='prof'?r.lv:(tab==='nm'?r.kind:r.cat)));f.innerHTML='<option value="">全部等级/分类</option>';[...set].sort().forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;f.appendChild(o)})}
function hl(s,terms){let e=s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));terms.forEach(t=>{if(!t)return;const re=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');e=e.replace(re,m=>'<mark>'+m+'</mark>')});return e}
function render(){
  const terms=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean), fv=f.value;
  let rows=D[tab].filter(r=>{
    if(fv && !(r.lv===fv||r.cat===fv||r.kind===fv)) return false;
    const blob=Object.values(r).join(' ').toLowerCase();
    return terms.every(t=>blob.includes(t));
  });
  if(sortKey>=0){const k=cols[tab][sortKey][1].split('.')[1];rows.sort((a,b)=>String(a[k]||'').localeCompare(String(b[k]||''),'zh')*(sortAsc?1:-1))}
  const c=cols[tab];
  tb.tHead.innerHTML='<tr>'+c.map((x,i)=>'<th data-i="'+i+'">'+x[0]+(i===sortKey?(sortAsc?' ▲':' ▼'):'')+'</th>').join('')+'</tr>';
  tb.tBodies[0].innerHTML=rows.map(r=>'<tr>'+c.map(x=>{
    let v=r[x[1].split('.')[1]]||'';
    let cls=x[1].endsWith('loc')?'loc':(x[1].endsWith('text')?'txt':'');
    if(x[0]==='等级') return '<td><span class="tag '+v+'">'+v+'</span></td>';
    return '<td class="'+cls+'">'+hl(String(v),terms)+'</td>';
  }).join('')+'</tr>').join('');
  cnt.textContent='共 '+rows.length+' 条 / '+D[tab].length+' 条';
  tb.tHead.querySelectorAll('th').forEach(th=>th.onclick=()=>{const i=+th.dataset.i;if(sortKey===i)sortAsc=!sortAsc;else{sortKey=i;sortAsc=true}render()});
}
document.querySelectorAll('button[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('button[data-t]').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.t;sortKey=-1;q.value='';options();render()});
q.oninput=render;f.onchange=render;options();render();
